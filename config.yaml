# Draft configuration. Freeze and version every null/TODO before a registered run.
protocol_version: "draft-0.8.4"
package_version: "prefreeze-package-0.8.4"
schema_version: "prefreeze-schema-0.8.3"
registration_status: "pre-freeze"

# Supplied by a registered run invocation; never set during scaffold construction.
run_id: null

# TODO before freeze: set the inclusive publication cutoff and its timezone/interpretation.
publication_cutoff: null

ask_text_batch_size: 10

paths:
  protocol: "PROTOCOL.md"
  empirical_seeds: "seeds_empirical.csv"
  review_seeds: "seeds_reviews.csv"
  queries: "queries.md"
  schemas: "schemas"
  tools: "tools"
  runs: "runs"
  consolidated_outputs: "outputs/consolidated"

fulltext:
  permit_preprints: true
  require_fulltext_for_final_classification: true

execution:
  independent_run: true
  checkpoint_after_each_wave: true
  route_order: "principal-first-blind-last"
  supplementary_blind_lane_mandatory: true
  title_screen_batch_size: 25
  abstract_screen_batch_size: 10
  smaller_semantic_batches_allowed: true
  batch_membership_is_evidence: false
  semantic_auto_exclusion_mechanisms: []
  prohibited_auto_exclusion_mechanisms:
    - "regex-or-keyword"
    - "embedding-similarity-threshold"
    - "citation-count-threshold"
    - "numerical-LLM-relevance-score"
    - "hidden-lexical-heuristic"

identifiers:
  paper_prefix: "P"
  experiment_separator: "_E"
  comparison_separator: "_C"
  decision_separator: "_D"
  search_separator: "_S"
  discovery_separator: "_R"
  auxiliary_separator: "_AUX"
  evidence_link_separator: "_EL"
  evidence_bundle_separator: "_EB"
  evidence_assessment_separator: "_EA"
  fulltext_asset_separator: "_FT"

search:
  # TODO before freeze: name the permitted search/citation sources in fixed order.
  preferred_sources: []
  # TODO before freeze: specify deterministic fallbacks for unavailable sources.
  fallback_order: []
  # Calibration conclusion only; this does not populate the frozen registered fields above.
  calibration_source_strategy:
    OpenAlex: "primary broad discovery, identity, and citation source"
    Europe_PMC: "parallel metadata/full-text source and conditional biomedical citation fallback"
    Crossref: "DOI/bibliographic identity and publisher-deposited backward-reference fallback"
    Semantic_Scholar: "optional; not required"
  conservative_execution:
    supplementary_blind_lane:
      mandatory: true
      order: "after provisional satisfaction of every principal frontier"
      sources: ["OpenAlex", "Europe PMC"]
      active_families: ["QCAL4-ATTN", "QCAL4-META", "QCAL4-BIND", "QCAL4-MEM", "QCAL4-DEC"]
      disabled_families: ["QCAL4-LEARN"]
      max_results_per_source_family: 40
      max_windows_per_source_family: 1
      second_page_or_cursor: false
      redistribute_unused_quota: false
      screen_every_return: true
    process_trigger:
      sources: ["OpenAlex", "Europe PMC"]
      max_results_per_source_y: 50
      max_windows_per_source_y: 1
      second_page_or_cursor: false
      redistribute_unused_quota: false
      same_normalized_y_retrigger: false
      genuinely_new_y_recursion_only: true
    completed_window_resume_policy: "reuse-durable-snapshot; retry-only-failed-or-incomplete"

evidence_reuse:
  scientific_bundles_are_classificatory: true
  execution_assessments_propagate_scientific_codes: false
  require_exact_regime_fingerprint_for_assessment_reuse: true

fulltext_cache:
  one_verified_asset_per_paper_version: true
  reuse_hash: true
  reuse_extraction_by_tool_version: true
  article_version_mismatch_blocks_reuse: true

calibration_002:
  # DRAFT calibration parameters only. CALIB002 must determine whether each
  # query block can be screened exhaustively or needs a frozen bound.
  query_page_size: 100
  query_max_pages_per_block: 3
  query_max_records_per_block: 300
  screen_all_within_bound: true
  ordering_instability_policy: "save identifiers for each completed page; on retry deduplicate by stable identifier and continue from the last durable cursor/page"
  citation_union_sources: ["OpenAlex", "Europe PMC"]
  citation_union_page_size: 100
  citation_union_max_records_per_direction_per_source: 200
  citation_union_record_overlap: true
  citation_union_record_source_unique_title_survivors: true

calibration_003:
  # DRAFT calibration instruments only; no CALIB003 run is authorized by this file.
  query_page_size: 100
  query_max_pages_per_family_source: 2
  query_max_records_per_family_source: 200
  screen_all_within_bound: true
  sentinel_recovery_threshold: null
  fulltext_sample_size: 12
  fulltext_sample_population: "newly discovered abstract screen-in candidates"
  fulltext_sample_order: "fulltext priority high-to-low, then earliest durable discovery_id, then paper_id"
  fulltext_sample_tie_breaker_excludes_expected_outcome: true

calibration_004:
  # Historical completed calibration parameters only. They do not authorize a rerun
  # and are not the active conservative execution contract above.
  independent_query_families: 6
  independent_query_sources: ["OpenAlex", "Europe PMC"]
  independent_query_page_size: 40
  independent_query_max_pages_per_family_source: 1
  independent_query_max_records: 480
  dynamic_query_sources: ["OpenAlex", "Europe PMC"]
  dynamic_query_page_size: 50
  dynamic_query_max_pages_per_source: 1
  dynamic_query_max_records: 100
  mechanical_Meyen_role_check_records: 0
  total_max_records: 580
  excluded_scope: "citation calibration; F/full-text calibration; source ordering; recursive process search"
