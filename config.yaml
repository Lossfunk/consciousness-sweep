# Draft configuration. Freeze and version every null/TODO before a registered run.
protocol_version: "draft-0.4"
package_version: "prefreeze-package-0.4"
schema_version: "prefreeze-schema-0.4"
registration_status: "pre-freeze"

# Supplied by a registered run invocation; never set during scaffold construction.
run_id: null

# TODO before freeze: set the inclusive publication cutoff and its timezone/interpretation.
publication_cutoff: null

ask_text_batch_size: 10

paths:
  protocol: "PROTOCOL.md"
  empirical_seeds: "seeds_empirical.csv"
  review_seeds: "seeds_reviews.csv"
  queries: "queries.md"
  schemas: "schemas"
  tools: "tools"
  runs: "runs"
  consolidated_outputs: "outputs/consolidated"

fulltext:
  permit_preprints: true
  require_fulltext_for_final_classification: true

execution:
  independent_run: true
  checkpoint_after_each_wave: true

identifiers:
  paper_prefix: "P"
  experiment_separator: "_E"
  comparison_separator: "_C"
  decision_separator: "_D"
  search_separator: "_S"
  discovery_separator: "_R"
  auxiliary_separator: "_AUX"

search:
  # TODO before freeze: name the permitted search/citation sources in fixed order.
  preferred_sources: []
  # TODO before freeze: specify deterministic fallbacks for unavailable sources.
  fallback_order: []

calibration_002:
  # DRAFT calibration parameters only. CALIB002 must determine whether each
  # query block can be screened exhaustively or needs a frozen bound.
  query_page_size: 100
  query_max_pages_per_block: 3
  query_max_records_per_block: 300
  screen_all_within_bound: true
  ordering_instability_policy: "save identifiers for each completed page; on retry deduplicate by stable identifier and continue from the last durable cursor/page"
  citation_union_sources: ["OpenAlex", "Europe PMC"]
  citation_union_page_size: 100
  citation_union_max_records_per_direction_per_source: 200
  citation_union_record_overlap: true
  citation_union_record_source_unique_title_survivors: true
